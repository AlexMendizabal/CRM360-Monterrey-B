nelmio_api_doc:
    documentation:
        info:
            title: CRM360 Monterrey API
            description: API REST del sistema CRM360 Monterrey - Backend
            version: 1.0.0
        servers:
            - url: /
              description: Servidor local
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                    description: Token JWT obtenido via /usuario/login
            schemas:
                ApiResponse:
                    type: object
                    properties:
                        success:
                            type: boolean
                        mensagem:
                            type: string
                            nullable: true
                        data:
                            type: object
                            nullable: true
        security:
            - Bearer: []
    areas:
        default:
            path_patterns:
                - ^/(?!_)  # Excluir rutas internas de Symfony (_profiler, _wdt)
