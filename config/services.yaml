# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
imports:
    - { resource: services/* }

parameters:
    app.mail.host: '%env(default::MAIL_HOST)%'
    app.mail.port: '%env(int:default::MAIL_PORT)%'
    app.mail.username: '%env(default::MAIL_USERNAME)%'
    app.mail.password: '%env(default::MAIL_PASSWORD)%'
    app.mail.encryption: '%env(default::MAIL_ENCRYPTION)%'
    app.sap.api_url: '%env(default::SAP_API_URL)%'
    app.sap.auth_user: '%env(default::SAP_AUTH_USER)%'
    app.sap.auth_password: '%env(default::SAP_AUTH_PASSWORD)%'
    app.url: '%env(default::APP_URL)%'

services:
    App\Services\Helper:
        arguments:
            $mailHost: '%app.mail.host%'
            $mailUsername: '%app.mail.username%'
            $mailPassword: '%app.mail.password%'
            $mailPort: '%app.mail.port%'
            $mailEncryption: '%app.mail.encryption%'
    App\Services\MailerService:
        arguments:
            $mailer: '@mailer.mailer'
            $defaultFrom: '%env(default::MAIL_USERNAME)%'

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: false
        bind:
            $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # ============================================================
    # Module Services (Microservicios extraidos de Helper.php)
    # ============================================================
    App\Module\:
        resource: '../src/Module/*'
        exclude: '../src/Module/{Entity,Migrations}'

    # Comercial Module
    App\Module\Comercial\Service\ClienteService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Module\Comercial\Service\VendedorService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Module\Comercial\Service\AlmacenService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Module\Comercial\Service\MaterialService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Module\Comercial\Service\OfertaService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Module\Comercial\Service\PrecioService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Module\Comercial\Service\CalculoMaterialService:
        arguments:
            $connection: '@doctrine.dbal.MONTERREY_connection'
            $storedProcedureService: '@App\Services\StoredProcedureService'

    # Core Module
    App\Module\Core\Service\UsuarioService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    # Shared Module
    App\Module\Shared\Service\CatalogService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'

    App\Module\Shared\Service\NotificationService:
        arguments:
            $connection: '@doctrine.dbal.default_connection'
            $mailHost: '%app.mail.host%'
            $mailUsername: '%app.mail.username%'
            $mailPassword: '%app.mail.password%'
            $mailPort: '%app.mail.port%'
            $mailEncryption: '%app.mail.encryption%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Symfony\Component\Serializer\Normalizer\PropertyNormalizer:
        arguments:
            $nameConverter: '@serializer.name_converter.camel_case_to_snake_case'
            $propertyTypeExtractor: '@property_info.php_doc_extractor'
        tags: [serializer.normalizer]

    # headers validation
    before_action_subscriber:
        class: App\Security\Core\BeforeActionSubscriber

    # JWT validation
    jwt_authenticator:
        class: App\Security\Core\JwtAuthenticator
