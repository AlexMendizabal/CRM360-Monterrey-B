# Routes extracted from src/Controller/Common/

# AtividadesController
common.atividades-registrar-acesso:
    path: /common/atividades/registrar-acesso
    controller: App\Controller\Common\AtividadesController::registrarAcesso
    methods: [PUT]

common.atividades-listar:
    path: /common/atividades/listar/{idModulo}
    controller: App\Controller\Common\AtividadesController::getAtividades
    methods: [GET]
    requirements:
        idModulo: '\d+'

common.atividades-atividade:
    path: /common/atividades/atividade/{idAtividade}
    controller: App\Controller\Common\AtividadesController::getAtividade
    methods: [GET]
    requirements:
        idAtividade: '\d+'

common.atividades/internas-listar:
    path: /common/atividades/internas/listar/{idSubModulo}
    controller: App\Controller\Common\AtividadesController::getAtividadesInternas
    methods: [GET]
    requirements:
        idSubModulo: '\d+'

