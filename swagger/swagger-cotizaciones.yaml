                - codAnexo
              properties:
                codAnexo:
                  type: integer
      responses:
        '200':
          description: Documento eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mensagem:
                    type: string

  # ============================================================
  # INTEGRACION SAP
  # ============================================================
  /comercial/ciclo-vendas/cotacoes/enviar_sap/{nrPedido}:
    get:
      tags: [Cotizaciones - SAP]
      summary: Enviar oferta a SAP
      description: Envia oferta a SAP. Solo funciona si la oferta no tiene codigo SAP, tipo_estado=14 y estado_oferta=1.
      parameters:
        - name: nrPedido
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Oferta enviada a SAP
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                  message:
                    type: string
                  success:
                    type: boolean
                  data_sap:
                    type: object

  /comercial/ciclo-vendas/cotacoes/vigencia_oferta/{codigo_oferta}:
    get:
      tags: [Cotizaciones - SAP]
      summary: Verificar vigencia de oferta en SAP
      description: Consulta y actualiza el estado de vigencia de la oferta desde SAP.
      parameters:
        - name: codigo_oferta
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado de vigencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  CodigoRespuesta:
                    type: integer
                  message:
                    type: string
                  success:
                    type: boolean

  /comercial/ciclo-vendas/cotacoes/oferta_id:
    get:
      tags: [Cotizaciones - SAP]
      summary: Obtener siguiente ID de oferta
      responses:
        '200':
          description: ID de oferta disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                  result:
                    type: integer
                  estado:
                    type: boolean

  # ============================================================
  # OFERTAS (OfertaController)
  # ============================================================
  /comercial/ciclo-vendas/ofeta/{codCotacao}/{idEmpresa}:
    get:
      tags: [Ofertas]
      summary: Obtener oferta individual con carrito
      description: "Nota: La ruta tiene un typo ('ofeta' en lugar de 'oferta')."
      parameters:
        - name: codCotacao
          in: path
          required: true
          schema:
            type: integer
        - name: idEmpresa
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Oferta con carrito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/ofertas/getlistsacliente:
    get:
      tags: [Ofertas - Catalogos]
      summary: Buscar clientes
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/ofertas/getlistsaclienteCajaTexto:
    get:
      tags: [Ofertas - Catalogos]
      summary: Buscar clientes para autocomplete (min 3 chars)
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: Top 5 clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/ofertas/getListaMateriales:
    get:
      tags: [Ofertas - Catalogos]
      summary: Buscar materiales para autocomplete (min 4 chars)
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 4
      responses:
        '200':
          description: Top 5 materiales
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ID_CODIGOMATERIAL:
                          type: integer
                        CODIGOMATERIAL:
                          type: string
                        DESCRICAO:
                          type: string
                        STOCK:
                          type: number
                        id_unidad:
                          type: integer
                        SIGLAS_UNI:
                          type: string
                        PESO:
                          type: number

  /comercial/ciclo-vendas/ofertas/getlistamaterial:
    get:
      tags: [Ofertas - Catalogos]
      summary: Listar todos los materiales
      responses:
        '200':
          description: Lista completa de materiales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/ofertas/PostCodigoCliente:
    post:
      tags: [Ofertas - Catalogos]
      summary: Obtener datos del cliente por codigo
      description: Retorna datos basicos, extendidos y contactos del cliente usando `PRC_DATOSCLIENTESOFERTA`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo
              properties:
                codigo:
                  type: string
      responses:
        '200':
          description: Datos del cliente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      basicData:
                        type: array
                        items:
                          type: object
                      extendedData:
                        type: array
                        items:
                          type: object
                      contacts:
                        type: array
                        items:
                          type: object

  /comercial/ciclo-vendas/ofertas/getAlmacenes:
    get:
      tags: [Ofertas - Catalogos]
      summary: Listar almacenes (ALM-V*)
      responses:
        '200':
          description: Lista de almacenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        DEPOSITOS:
                          type: string

  /comercial/ciclo-vendas/ofertas/getTipoContacto:
    get:
      tags: [Ofertas - Catalogos]
      summary: Listar tipos de contacto
      responses:
        '200':
          description: Tipos de contacto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/ofertas/getRubros:
    get:
      tags: [Ofertas - Catalogos]
      summary: Listar rubros/categorias de negocio
      responses:
        '200':
          description: Lista de rubros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/ofertas/getCondicionPago:
    get:
      tags: [Ofertas - Catalogos]
      summary: Listar condiciones de pago
      responses:
        '200':
          description: Condiciones de pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/ofertas/getEjecutivos:
    get:
      tags: [Ofertas - Catalogos]
      summary: Listar ejecutivos de venta
      responses:
        '200':
          description: Lista de ejecutivos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/ofertas/getStockMaterial:
    get:
      tags: [Ofertas - Stock]
      summary: Stock de material en un almacen
      description: Consulta stock local y refresca desde SAP (timeout 5s).
      parameters:
        - name: codDepo
          in: query
          required: true
          schema:
            type: string
        - name: codMate
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stock del material
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      StockDisponible:
                        type: number
                      StockTotal:
                        type: number
                      Comprometido:
                        type: number
                      Pedido:
                        type: number

  /comercial/ciclo-vendas/ofertas/getStockAll:
    get:
      tags: [Ofertas - Stock]
      summary: Stock de material en TODOS los almacenes
      description: Refresca desde SAP y muestra stock en todos los depositos.
      parameters:
        - name: codMate
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stock por almacen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id_deposito:
                          type: string
                        cantidad:
                          type: number
                        NOMBRE_DEPOSITO:
                          type: string
                        stock:
                          type: number
                        comprometido:
                          type: number
                        pedido:
                          type: number

  /comercial/ciclo-vendas/ofertas/getMaterialDatosMaestros:
    get:
      tags: [Ofertas - Stock]
      summary: Datos maestros de un material
      parameters:
        - name: codigo
          in: query
          required: true
          schema:
            type: string
        - name: lista
          in: query
          required: true
          schema:
            type: string
          description: Lista de precios
      responses:
        '200':
          description: Datos maestros del material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /comercial/ciclo-vendas/oferta/registrar:
    post:
      tags: [Ofertas - CRUD]
      summary: Registrar nueva oferta
      description: |
        Registra una nueva oferta con soporte transaccional y deteccion de duplicados via SHA256.
        Si no requiere autorizacion, envia directamente a SAP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaRegistrar'
      responses:
        '200':
          description: Oferta registrada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                  message:
                    type: string
                  success:
                    type: boolean
                  data_sap:
                    type: object
        '409':
          description: Oferta duplicada detectada
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                    example: 409
                  message:
                    type: string
                  success:
                    type: boolean

  /comercial/ciclo-vendas/ofertas/listar:
    post:
      tags: [Ofertas - Listados]
      summary: Buscar/listar ofertas con filtros
      description: Usa `PRC_BUSCADOR_OFERTA` con multiples filtros.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo_oferta:
                  type: string
                nombre_cliente:
                  type: string
                nombre_vendedor:
                  type: string
                modo_entrega:
                  type: integer
                fecha_inicial:
                  type: string
                  format: date
                fecha_final:
                  type: string
                  format: date
                estado_oferta:
                  type: integer
                tipo_estado:
                  type: integer
      responses:
        '200':
          description: Lista de ofertas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Oferta'

  /comercial/ciclo-vendas/ofertas/get_historial_oferta_cliente:
    get:
      tags: [Ofertas - Listados]
      summary: Historial de ofertas por cliente (ultimas 10)
      parameters:
        - name: codigo_cliente
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ultimas 10 ofertas del cliente
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        codigo_oferta:
                          type: string
                        peso_total:
                          type: number
                        cantidad_total:
                          type: number
                        fecha_creacion:
                          type: string
                        monto_total:
                          type: number
                        descripcion:
                          type: string
                  success:
                    type: boolean

  /comercial/ciclo-vendas/ofertas/get_oferta_editar:
    get:
      tags: [Ofertas - CRUD]
      summary: Obtener oferta completa para edicion
      parameters:
        - name: id_oferta
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Oferta con detalle de materiales
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ofertaDetalle:
                        type: array
                        items:
                          type: object
                          properties:
                            tonelada:
                              type: number
                            id_material:
                              type: integer
                            cantidad:
                              type: number
                            descripcion:
                              type: string
                            articulo:
                              type: string
                            unidad:
                              type: string
                            descuento:
                              type: number
                            peso:
                              type: number
                            precioUnitario:
                              type: number
                            precioTotal:
                              type: number
                            almacen:
                              type: string

  /comercial/ciclo-vendas/ofertas/getOfertaApp:
    get:
      tags: [Ofertas - Mobile]
      summary: Verificar oferta por firma SHA256 (App movil)
      parameters:
        - name: firma
          in: query
          required: true
          schema:
            type: string
          description: Hash SHA256 de la oferta
      responses:
        '200':
          description: Estado de la oferta
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        estado_oferta:
                          type: integer
                        tipo_estado:
                          type: integer

  /comercial/ciclo-vendas/ofertas/insertClientesTemp:
    get:
      tags: [Ofertas - Utilidades]
      summary: Refrescar tabla temporal de clientes
      description: Ejecuta `sp_InsertClientesTemp` para actualizar la cache de clientes.
      responses:
        '200':
          description: Tabla refrescada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
