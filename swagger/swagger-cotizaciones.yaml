openapi: 3.0.3
info:
  title: CRM360 Monterrey - API Cotizaciones (Ciclo de Ventas)
  description: |
    API REST para la gestion de cotizaciones y ofertas del ciclo de ventas del CRM360 Monterrey.
    Incluye gestion de cotizaciones, materiales, duplicatas, descuentos, ofertas y envio a SAP.

    **Autenticacion:** Todas las rutas requieren el header `X-User-Info` con token JWT
    y `Authorization: Bearer {token}`.
  version: 1.0.0
  contact:
    name: CRM360 Monterrey
servers:
  - url: http://172.20.20.12
    description: Servidor de Produccion (IIS - Windows Server)

security:
  - bearerAuth: []
  - userInfo: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    userInfo:
      type: apiKey
      in: header
      name: X-User-Info
      description: Token JWT con informacion del usuario

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        mensagem:
          type: string
          nullable: true
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        mensagem:
          type: string
        data:
          type: string

    Cotizacion:
      type: object
      properties:
        nrPedido:
          type: integer
          description: Numero del pedido/cotizacion
        codEmpresa:
          type: integer
          description: Codigo de empresa
        codDeposito:
          type: integer
          description: Codigo del deposito/almacen
        codSituacao:
          type: integer
          description: Codigo de situacion
        codVendedor:
          type: integer
        nomeVendedor:
          type: string
        codCliente:
          type: integer
        nomeCliente:
          type: string
        dataEmissao:
          type: string
          format: date
        dataEntrega:
          type: string
          format: date
        valorProposta:
          type: number
          format: double
        travas:
          type: array
          items:
            type: object
        imprimirSeparacao:
          type: integer
          enum: [0, 1]

    Oferta:
      type: object
      properties:
        id_oferta:
          type: integer
        codigo_oferta:
          type: string
        fecha_oferta:
          type: string
          format: date-time
        id_cliente:
          type: integer
        nombre_cliente:
          type: string
        id_vendedor:
          type: integer
        nombre_vendedor:
          type: string
        monto_total:
          type: number
          format: double
        monto_total_bruto:
          type: number
          format: double
        peso_total:
          type: number
          format: double
        cantidad_total:
          type: number
          format: double
        descuento_total:
          type: number
          format: double
        estado_oferta:
          type: integer
        tipo_estado:
          type: integer
        descripcion_estado:
          type: string

    Material:
      type: object
      properties:
        codMaterial:
          type: integer
        nomeMaterial:
          type: string
        unidade:
          type: string
        quantidade:
          type: number
        valor:
          type: number
          format: double
        valorTotal:
          type: number
          format: double
        percentualIcms:
          type: number
        percentualIpi:
          type: number
        valorIcms:
          type: number
        valorIpi:
          type: number
        valorIcmsSt:
          type: number

    MaterialCarrinho:
      type: object
      required:
        - codMaterial
        - quantidade
        - valor
      properties:
        codMaterial:
          type: integer
        quantidade:
          type: number
        valor:
          type: number
          format: double
        valorUnit:
          type: number
          format: double
        valorTotal:
          type: number
          format: double
        percentualIcms:
          type: number
        percentualIpi:
          type: number
        valorIpi:
          type: number
        valorIcms:
          type: number
        aliquotaReducaoIcms:
          type: number
        valorBaseIcmsSt:
          type: number
        valorIcmsSt:
          type: number
        quantidadeItem:
          type: number
        qtdePecas:
          type: number
        medida1:
          type: number
        sequenciaLote:
          type: integer
        nrPedidoCliente:
          type: string
        codItemPedidoCliente:
          type: string
        codProdutoCliente:
          type: string

    OfertaRegistrar:
      type: object
      properties:
        params:
          type: object
          properties:
            almacenDespacho:
              type: string
            monto_total:
              type: number
              format: double
            monto_total_bruto:
              type: number
              format: double
            peso_total:
              type: number
              format: double
            descuento_total:
              type: number
              format: double
            cantidad_total:
              type: number
              format: double
            id_forma_pago:
              type: integer
            id_lista_precio:
              type: integer
            id_moneda:
              type: integer
            id_iva:
              type: integer
            id_cliente:
              type: integer
            categoria:
              type: string
            id_vendedor:
              type: integer
            id_contacto:
              type: integer
            nodocumento:
              type: string
            observacion:
              type: string
            razonsocial:
              type: string
            logistica:
              type: object
              properties:
                modoEntrega:
                  type: integer
                id_centro_logistico:
                  type: integer
                destino:
                  type: string
                destinarioFactura:
                  type: string
                despachoMercaderia:
                  type: string
                fechaEntrega:
                  type: string
                  format: date
                cordenadas:
                  type: string
            forma_contacto:
              type: integer
            id_propietario:
              type: integer
            qr:
              type: string
            autorizacion:
              type: boolean
            fecha_inicial:
              type: string
              format: date
            fecha_final:
              type: string
              format: date
            firma:
              type: string
              description: SHA256 hash para deteccion de duplicados
            carrinho:
              type: object
              properties:
                materiales:
                  type: array
                  items:
                    type: object
                    properties:
                      id_material:
                        type: integer
                      cantidad:
                        type: number
                      precio:
                        type: number
                        format: double
                      descuento:
                        type: number
                      peso:
                        type: number
                      almacen:
                        type: string
                      modoEntrega:
                        type: integer
                      tonelada:
                        type: number

    GuardarCotizacion:
      type: object
      properties:
        id_oferta:
          type: integer
          description: Si se envia, edita la oferta existente. Si no, crea nueva.
        id_forma_pago:
          type: integer
        id_lista_precio:
          type: integer
        id_cliente:
          type: integer
        id_vendedor:
          type: integer
        id_persona_contacto:
          type: integer
        id_almacen:
          type: integer
        tipo_entrega:
          type: integer
        centroLogisticoControl:
          type: integer
        fecha_final:
          type: string
          format: date
        fecha_inicial:
          type: string
          format: date
        monto_total:
          type: number
          format: double
        monto_total_bruto:
          type: number
          format: double
        peso_total:
          type: number
          format: double
        descuento_total:
          type: number
          format: double
        cantidad_total:
          type: number
          format: double
        direccion_cliente:
          type: string
        latitud:
          type: string
        longitud:
          type: string
        direccion_entrega:
          type: string
        observacion:
          type: string
        formaContacto:
          type: integer
        tipoContacto:
          type: integer
        celular:
          type: string
        telefono:
          type: string
        correo_electronico:
          type: string
        nombre_factura:
          type: string
        carrinho:
          type: array
          items:
            type: object
            properties:
              id_material:
                type: integer
              cantidad:
                type: number
              precio:
                type: number
                format: double
              descuento:
                type: number
              peso:
                type: number

    Descuento:
      type: object
      properties:
        id:
          type: integer
        codigomaterial:
          type: string
        id_material:
          type: integer
        id_departamento:
          type: integer
        id_tipo_cliente:
          type: integer
        rango_inicial:
          type: number
        rango_final:
          type: number
        descuento:
          type: number

paths:
  # ============================================================
  # PERMISOS DE ACCESO
  # ============================================================
  /comercial/ciclo-vendas/cotacoes/permissoes-acesso:
    get:
      tags: [Cotizaciones - Permisos]
      summary: Obtener permisos de acceso a cotizaciones
      description: Retorna permisos del usuario para acceso a clientes, historial de exclusion y duplicatas.
      responses:
        '200':
          description: Permisos obtenidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      acessoClientes:
                        type: boolean
                      historicoExclusao:
                        type: boolean
                      duplicataCarteira:
                        type: boolean

  # ============================================================
  # LISTADO DE COTIZACIONES
  # ============================================================
  /comercial/ciclo-vendas/cotacoes/lista:
    get:
      tags: [Cotizaciones - Listados]
      summary: Listar cotizaciones/pedidos
      description: Lista cotizaciones con paginacion, filtros y travas. Usa `PRC_PEDI_CONS`.
      parameters:
        - name: tipoData
          in: query
          schema:
            type: integer
            default: 1
        - name: dataInicial
          in: query
          schema:
            type: string
            format: date
        - name: dataFinal
          in: query
          schema:
            type: string
            format: date
        - name: codSituacao
          in: query
          schema:
            type: integer
            default: 0
        - name: nrPedido
          in: query
          schema:
            type: string
        - name: codEmpresa
          in: query
          schema:
            type: integer
        - name: codDeposito
          in: query
          schema:
            type: integer
        - name: cliente
          in: query
          schema:
            type: string
        - name: codVendedor
          in: query
          schema:
            type: integer
        - name: orderBy
          in: query
          schema:
            type: string
            default: nrPedido
        - name: orderType
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
        - name: pagina
          in: query
          schema:
            type: integer
        - name: registros
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Lista de cotizaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cotizacion'

  /comercial/ciclo-vendas/cotacoes/lista_cotizacion:
    get:
      tags: [Cotizaciones - Listados]
      summary: Listar cotizaciones/ofertas (vista espanol)
      description: Lista ofertas con joins completos (cliente, vendedor, lista precios, modo entrega, autorizacion). Filtrado por rol de vendedor.
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
        - name: registros
          in: query
          schema:
            type: integer
        - name: orderBy
          in: query
          schema:
            type: string
        - name: orderType
          in: query
          schema:
            type: string
        - name: tipoData
          in: query
          schema:
            type: integer
        - name: dataInicial1
          in: query
          schema:
            type: string
            format: date
        - name: dataInicial2
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: integer
        - name: id_oferta
          in: query
          schema:
            type: integer
        - name: codigo_oferta
          in: query
          schema:
            type: string
        - name: cliente
          in: query
          schema:
            type: string
        - name: codVendedor
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Ofertas y clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Oferta'
                  clientes:
                    type: array
                    items:
                      type: object
                  estado:
                    type: boolean

  /comercial/ciclo-vendas/cotacoes/cliente_oferta:
    post:
      tags: [Cotizaciones - Listados]
      summary: Obtener clientes con ofertas
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Clientes con ofertas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id_cliente:
                          type: integer
                        nombre:
                          type: string

  # ============================================================
  # VERIFICACION DE OFERTAS
  # ============================================================
  /comercial/ciclo-vendas/cotacoes/verifica-oferta/{idContato}:
    get:
      tags: [Cotizaciones - Verificacion]
      summary: Verificar si un contacto tiene oferta registrada
      parameters:
        - name: idContato
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resultado de verificacion
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mensagem:
                    type: string
                  data:
                    type: integer
                    nullable: true

  # ============================================================
  # DETALLE DE COTIZACIONES
  # ============================================================
  /comercial/ciclo-vendas/cotacoes/detalhes/{codEmpresa}/{nrPedido}:
    get:
      tags: [Cotizaciones - Detalle]
      summary: Obtener detalles de una cotizacion
      description: Retorna contactos y materiales con totales para una cotizacion.
      parameters:
        - name: codEmpresa
          in: path
          required: true
          schema:
            type: integer
        - name: nrPedido
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalles de la cotizacion
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      contatos:
                        type: array
                        items:
                          type: object
                      itens:
                        type: object
                        properties:
                          materiais:
                            type: array
                            items:
                              $ref: '#/components/schemas/Material'
                          total:
                            type: object
                            properties:
                              quantidade:
                                type: number
                              valor:
                                type: number
                              qtdePecas:
                                type: number

  /comercial/ciclo-vendas/cotacoes/oferta_detalle:
    get:
      tags: [Cotizaciones - Detalle]
      summary: Obtener detalle de oferta con materiales
      parameters:
        - name: id_oferta
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de oferta
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                  result:
                    type: object
                    properties:
                      oferta:
                        type: array
                        items:
                          type: object
                      analitico:
                        type: array
                        items:
                          type: object
                      total:
                        type: object
                        properties:
                          cantidad:
                            type: number
                  estado:
                    type: boolean

  /comercial/ciclo-vendas/cotacoes/materiais/detalhes/{codEmpresa}/{nrPedido}:
    get:
      tags: [Cotizaciones - Detalle]
      summary: Obtener materiales de una cotizacion
      parameters:
        - name: codEmpresa
          in: path
          required: true
          schema:
            type: integer
        - name: nrPedido
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Materiales de la cotizacion
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Material'

  /comercial/ciclo-vendas/cotacoes/{codCotacao}/{idEmpresa}:
    get:
      tags: [Cotizaciones - Detalle]
      summary: Obtener cotizacion individual con carrito
      parameters:
        - name: codCotacao
          in: path
          required: true
          schema:
            type: integer
        - name: idEmpresa
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cotizacion con carrito de materiales
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      carrinho:
                        type: array
                        items:
                          $ref: '#/components/schemas/Material'

  # ============================================================
  # SITUACION Y LIBERACION
  # ============================================================
  /comercial/ciclo-vendas/cotacoes/situacao-liberacao:
    get:
      tags: [Cotizaciones - Liberacion]
      summary: Estado de liberacion de cotizacion
      parameters:
        - name: nrPedido
          in: query
          required: true
          schema:
            type: string
        - name: codEmpresa
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado de liberacion con travas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      travas:
                        type: array
                        items:
                          type: object

  # ============================================================
  # OPERACIONES CON COTIZACIONES
  # ============================================================
  /comercial/ciclo-vendas/cotacoes/salvar:
    post:
      tags: [Cotizaciones - CRUD]
      summary: Guardar cotizacion completa (sistema legacy)
      description: Guarda una cotizacion completa con carrito de materiales. Usado por el sistema legacy con PRC_PEDI_CONS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codCotacao:
                  type: integer
                codEmpresa:
                  type: integer
                codDeposito:
                  type: integer
                codSituacao:
                  type: integer
                codCliente:
                  type: integer
                codContato:
                  type: integer
                codEndereco:
                  type: integer
                codFormaPagamento:
                  type: integer
                dataEntrega:
                  type: string
                  format: date
                dataValidade:
                  type: string
                  format: date
                notaFiscalMae:
                  type: string
                duplicatasSomenteCarteira:
                  type: boolean
                codFormaContato:
                  type: integer
                codOrigemContato:
                  type: integer
                observacoes:
                  type: string
                dadosAdicionais:
                  type: string
                freteConta:
                  type: integer
                codTransportadora:
                  type: integer
                carrinho:
                  type: array
                  items:
                    $ref: '#/components/schemas/MaterialCarrinho'
      responses:
        '200':
          description: Cotizacion guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  /comercial/ciclo-vendas/cotacoes/guardar:
    post:
      tags: [Cotizaciones - CRUD]
      summary: Guardar/editar cotizacion (sistema nuevo)
      description: |
        Crea o edita una oferta/cotizacion. Si `id_oferta` esta presente, edita la existente.
        Puede actualizar info de contacto del cliente. Envia a SAP automaticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardarCotizacion'
      responses:
        '200':
          description: Cotizacion guardada/editada
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: integer
                  message:
                    type: string
                  success:
                    type: boolean
                  data_sap:
                    type: object

  /comercial/ciclo-vendas/cotacoes/reservar:
    get:
      tags: [Cotizaciones - CRUD]
      summary: Reservar ID de cotizacion
      parameters:
        - name: codEmpresa
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ID reservado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      nrProposta:
                        type: integer

  /comercial/ciclo-vendas/cotacoes/transfere-faturamento:
    post:
      tags: [Cotizaciones - Operaciones]
      summary: Transferir cotizacion a facturacion
      description: Transfiere una propuesta a facturacion via TID Software linked server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nrPedido
                - codEmpresa
              properties:
                nrPedido:
                  type: integer
                codEmpresa:
                  type: integer
                nomeLinha:
                  type: string
      responses:
        '200':
          description: Transferencia realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: integer

  /comercial/ciclo-vendas/cotacoes/trocar/cliente:
    post:
      tags: [Cotizaciones - Operaciones]
      summary: Cambiar cliente de una cotizacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nrPedido
                - codEmpresa
                - selectedCodCliente
              properties:
                nrPedido:
                  type: integer
                codEmpresa:
                  type: integer
                selectedCodCliente:
                  type: integer
      responses:
        '200':
          description: Cliente cambiado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: integer
                    description: Numero de propuesta

  /comercial/ciclo-vendas/cotacoes/duplicar-proposta:
    post:
      tags: [Cotizaciones - Operaciones]
      summary: Duplicar propuesta/cotizacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nrPedido
                - codEmpresa
              properties:
                nrPedido:
                  type: integer
                codEmpresa:
                  type: integer
      responses:
        '200':
          description: Propuesta duplicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: integer

  /comercial/ciclo-vendas/cotacoes/desdobrar-proposta:
    post:
      tags: [Cotizaciones - Operaciones]
      summary: Dividir propuesta por materiales seleccionados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nrPedido
                - codEmpresa
                - selectedMateriais
              properties:
                codDeposito:
                  type: integer
                nrPedido:
                  type: integer
                codEmpresa:
                  type: integer
                selectedMateriais:
                  type: array
                  items:
                    type: object
                    properties:
                      codMaterial:
                        type: integer
      responses:
        '200':
          description: Propuesta dividida
