; CRM360 Monterrey - PHP Configuration
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120
max_input_vars = 3000
date.timezone = America/Monterrey

; Errores
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; SQL Server requiere esto para evitar warnings
sqlsrv.ClientBufferMaxKBSize = 524288
pdo_sqlsrv.client_buffer_max_kb_size = 524288
